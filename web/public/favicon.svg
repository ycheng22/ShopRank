<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Shopping Bag Handle -->
  <path d="M 23 21 C 23 11.5, 41 11.5, 41 21" fill="none" stroke="url(#handleGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Shopping Bag Body with Soft Drop Shadow -->
  <path d="M 16 21 L 48 21 Q 51 21 50.5 24 L 47 48.5 Q 46.5 52 43 52 L 21 52 Q 17.5 52 17 48.5 L 13.5 24 Q 13 21 16 21 Z" 
        fill="url(#bagGrad)" 
        filter="url(#shadow)" />

  <!-- 3 Ascending Ranking Lift Bars -->
  <!-- Lexical: Ice Blue -->
  <rect x="21" y="38" width="5.5" height="9" rx="1.5" fill="#93c5fd" />
  <!-- Dense Vector: Mint Emerald -->
  <rect x="29.25" y="32" width="5.5" height="15" rx="1.5" fill="#34d399" />
  <!-- Cross-Encoder Peak #1: Crisp White -->
  <rect x="37.5" y="26" width="5.5" height="21" rx="1.5" fill="#ffffff" />

  <!-- Golden 4-point Rank Star Sparkle -->
  <path d="M 46 16.5 Q 46 20.5 50 20.5 Q 46 20.5 46 24.5 Q 46 20.5 42 20.5 Q 46 20.5 46 16.5 Z" fill="#fbbf24" />
</svg>