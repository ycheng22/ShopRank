name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install uv
      run: pip install uv
    - name: Install dependencies
      run: uv venv && uv pip install -e .[dev]
    - name: Lint with ruff
      run: uv run ruff check .
    - name: Type check with mypy
      run: uv run mypy app core adapters evals tests
    - name: Test with pytest
      run: uv run pytest
