[project]
name = "shoprank"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic-settings>=2.2.1",
    "retrieval-core @ git+https://github.com/ycheng22/RetrievalCore@v0.1.0",
    "pandas>=3.0.5",
    "numpy>=2.5.2",
    "pyarrow>=25.0.1",
    "jupyter>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "adapters", "evals"]

[tool.hatch.metadata]
allow-direct-references = true



[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "."
]
